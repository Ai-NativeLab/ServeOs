# Deploys to Vercel from CI instead of through Vercel's Git integration.
#
# Why: Vercel's Hobby plan refuses to deploy a PRIVATE repository owned by a
# GitHub organisation. Ai-NativeLab/ServeOs is currently public, which is the
# only reason deploys work today — making it private would break production.
# Building here and uploading a prebuilt deployment sidesteps that entirely,
# because Vercel never has to pull the source itself.
#
# INERT UNTIL SWITCHED ON. Every job is gated on the repository variable
# VERCEL_DEPLOY_ENABLED == 'true'. Merging this file changes nothing until that
# variable is set, so it cannot cause double deployments while the Git
# integration is still connected.
#
# See docs/references/vercel-cli-deploy.md for the full cutover runbook.

name: vercel-deploy

on:
  pull_request:
  push:
    branches: [main, qa]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # apps/pos keeps electron as a devDependency for the desktop build. Nothing
  # here builds it, and its postinstall fetches a ~100 MB binary.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  # ── Preview: every PR ────────────────────────────────────────────────────
  preview:
    name: preview
    if: ${{ vars.VERCEL_DEPLOY_ENABLED == 'true' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i -g vercel@65.5.0

      # Pulls the project's Preview env vars so the build sees the same
      # configuration Vercel's own builder would have used.
      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt
        id: deploy
        timeout-minutes: 10
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --yes --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview URL on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\n**Preview deployed** → ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

  # ── Production: main → serveos.tech ──────────────────────────────────────
  production:
    name: production
    if: ${{ vars.VERCEL_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Room for the deploy step's own 10-minute limit to fire first, so the
    # "migrated but not activated" step below still gets to run.
    timeout-minutes: 30
    environment: production
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i -g vercel@65.5.0

      # The production build applies database migrations before the deploy goes
      # live (scripts/release-migrate.ts, run by package.json's vercel-build),
      # so it needs the real production env — which is what `vercel pull`
      # fetches, apart from DATABASE_URL (next step).
      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Migrations get DATABASE_URL from a GitHub secret instead of the pulled
      # file, after checking it is on the same host as the Vercel project's
      # value (which the deployed app uses). Why, and what is still unproven:
      # the comment in the script and PR #162.
      - name: Swap in the DATABASE_URL secret (checked against Vercel's)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: bash .github/scripts/use-secret-database-url.sh .vercel/.env.production.local PROD_DATABASE_URL

      - name: Build
        id: build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        id: deploy
        # Uploads take seconds; a deploy stuck in Vercel's queue should fail
        # loudly here rather than run out the job clock.
        timeout-minutes: 10
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --yes --archive=tgz --token="$VERCEL_TOKEN")
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"

      # The build ran release-migrate, so the schema is already migrated; if
      # the deploy then failed, timed out or was cancelled, the old code is
      # still live on the new schema. See the runbook's "Migrated but not
      # activated" section.
      - name: Flag a migrated but not activated deploy
        if: ${{ always() && steps.build.outcome == 'success' && steps.deploy.outcome != 'success' }}
        run: |
          echo "::error::Production schema migrated, deploy not activated (deploy step: ${{ steps.deploy.outcome }})."
          {
            echo "### Production: schema migrated, deploy not activated"
            echo ""
            echo "The build applied migrations, then the deploy step ended with \`${{ steps.deploy.outcome }}\`."
            echo "The previous deployment is still serving traffic against the new schema."
            echo "See docs/references/vercel-cli-deploy.md, \"Migrated but not activated\"."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── QA: qa branch → qa.serveos.tech ──────────────────────────────────────
  # The QA Vercel project tracks the `qa` branch as ITS production environment,
  # so this also deploys with --prod, just against the QA project id.
  qa:
    name: qa
    if: ${{ vars.VERCEL_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/qa' }}
    runs-on: ubuntu-latest
    # Room for the deploy step's own 10-minute limit to fire first, so the
    # "migrated but not activated" step below still gets to run.
    timeout-minutes: 30
    environment: qa
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_QA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i -g vercel@65.5.0

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Same swap and check as the production job.
      - name: Swap in the DATABASE_URL secret (checked against Vercel's)
        env:
          DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
        run: bash .github/scripts/use-secret-database-url.sh .vercel/.env.production.local QA_DATABASE_URL

      - name: Build
        id: build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt to QA
        id: deploy
        # Uploads take seconds; a deploy stuck in Vercel's queue should fail
        # loudly here rather than run out the job clock.
        timeout-minutes: 10
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --yes --archive=tgz --token="$VERCEL_TOKEN")
          echo "QA: $url" >> "$GITHUB_STEP_SUMMARY"

      # The build ran release-migrate, so the schema is already migrated; if
      # the deploy then failed, timed out or was cancelled, the old code is
      # still live on the new schema. See the runbook's "Migrated but not
      # activated" section.
      - name: Flag a migrated but not activated deploy
        if: ${{ always() && steps.build.outcome == 'success' && steps.deploy.outcome != 'success' }}
        run: |
          echo "::error::QA schema migrated, deploy not activated (deploy step: ${{ steps.deploy.outcome }})."
          {
            echo "### QA: schema migrated, deploy not activated"
            echo ""
            echo "The build applied migrations, then the deploy step ended with \`${{ steps.deploy.outcome }}\`."
            echo "The previous deployment is still serving traffic against the new schema."
            echo "See docs/references/vercel-cli-deploy.md, \"Migrated but not activated\"."
          } >> "$GITHUB_STEP_SUMMARY"
